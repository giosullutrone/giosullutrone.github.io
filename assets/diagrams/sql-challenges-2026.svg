<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc" fill="#27324b" font-family="Arial, Helvetica, sans-serif" font-weight="400">
  <title id="title">Text-to-SQL challenges: several dimensions to examine</title>
  <desc id="desc">Four connected cards surround Text-to-SQL: accuracy of queries, user interaction through conversation, trustworthiness including safety and security, and economics including cost and openness. The paper examines these dimensions and their research challenges; the diagram does not claim that they are solved or assign them measured values. Source: https://data.scitevents.org/Abstract.aspx?idEvent=pUOomaLGDs4%3D.</desc>
  
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#27324b" stroke-width="2.2" stroke-linejoin="round" /></marker>
  </defs>
  <rect width="900" height="600" fill="#f7efcf" />
  <g font-family="Arial, Helvetica, sans-serif" fill="#27324b" font-weight="400">
    <text x="48" y="80" font-size="56" letter-spacing="-1.8" fill="#27324b">Beyond query accuracy</text>
    <text x="48" y="129" font-size="34" letter-spacing="-0.5" fill="#27324b">Dimensions to examine in Text-to-SQL</text>
  </g>
