<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="400" fill="#27324b">
  <title id="title">A preliminary Arabic title-page dataset plan</title>
  <desc id="desc">Arabic pages undergo classification to identify frontispieces. A dashed proposed region then connects OCR, expert correction, and metadata. The IRCDL extended abstract describes a preliminary dataset plan; the dashed future stages are not presented as a completed dataset or workflow.</desc>
