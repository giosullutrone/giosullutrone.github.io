<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="400" fill="#27324b">
  <title id="title">Human-supported cataloguing in Digital Maktaba</title>
  <desc id="desc">Arabic documents and extraction tools support bibliographic records. Specialists participate in cataloguing, and the resulting records support search. The two-way specialist connection emphasizes the platform's semi-automatic purpose rather than fully automatic cataloguing.</desc>
