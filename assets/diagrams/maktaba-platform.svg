  <text x="44" y="72" font-size="52" fill="#27324b">Human-supported cataloguing</text>
  <text x="44" y="116" font-size="32" fill="#27324b">Digital Maktaba · semi-automatic</text>
  <rect x="340" y="150" width="310" height="84" rx="24" fill="#b9c9e2" stroke="#95a5bf" stroke-width="1.8" />
  <text x="495" y="203" text-anchor="middle" font-size="32" fill="#27324b">OCR · LLMs · VLMs</text>
