  <text x="36" y="72" font-size="52" fill="#27324b">Pages become catalogue data</text>
  <text x="36" y="116" font-size="32" fill="#27324b">DM-LP · access by research request</text>
  <rect x="36" y="160" width="265" height="188" rx="24" fill="#ffffff" stroke="#95a5bf" stroke-width="1.8" />
