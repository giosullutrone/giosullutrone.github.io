<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="400" fill="#27324b">
  <title id="title">DM-LP page classes and catalogue data</title>
  <desc id="desc">Frontispieces, indexes, and ISBN pages feed structured text extraction, which supports bibliographic metadata. The page shapes contain only empty cells and nonlinguistic strokes. Dataset access is by research request; this diagram does not claim unrestricted open access.</desc>
